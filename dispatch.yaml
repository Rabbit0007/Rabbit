server: http://rabbit-pentest-server:8000
runtime:
  max_workers: 2
  max_running_projects: 3
  max_project_workers: 2
  interval: 3
  healthcheck_timeout: 60
  prompt_group: default
tasks:
  decide:
    timeout: 300
    max_steps: 3
  execute:
    timeout: 300
    conclude_timeout: 90
container:
  image: ghcr.io/oritera/cairn-worker-container@sha256:d90d40b7c634b8d5dc9464e04b863a185b9efe964ffd2b246f6e5cbc2a2ef053
  network_mode: host
  completed_action: stop
  cap_add: []
  name_prefix: rabbit-pentest-dispatch-
  startup_name_prefix: rabbit-pentest-startup-healthcheck-
  extra_hosts:
    host.docker.internal: 127.0.0.1
    gateway.docker.internal: 127.0.0.1
    docker.for.mac.host.internal: 127.0.0.1
common_env:
  TSEC_SERVER_HOST: 10.0.0.44:8000
  TSEC_AGENT_TOKEN: xxx
workers:
- name: pi_deepseek-v4-pro_1
  type: pi
  enabled: false
  task_types:
  - decide
  - execute
  max_running: 1
  priority: 0
  env:
    TSEC_SERVER_HOST: 10.0.0.44:8000
    TSEC_AGENT_TOKEN: xxx
    PI_MODEL: deepseek-v4-pro
    PI_BASE_URL: https://api.deepseek.com/v1
    PI_API_KEY: ${PI_API_KEY_DS_OFFICIAL}
    PI_PROVIDER_API: openai-completions
- name: pi_deepseek-v4-pro_2
  type: pi
  enabled: false
  task_types:
  - decide
  - execute
  max_running: 1
  priority: 1
  env:
    TSEC_SERVER_HOST: 10.0.0.44:8000
    TSEC_AGENT_TOKEN: xxx
    PI_MODEL: deepseek-v4-pro
    PI_BASE_URL: https://api.deepseek.com/v1
    PI_API_KEY: ${PI_API_KEY_DS_OFFICIAL}
    PI_PROVIDER_API: openai-completions
- name: pi_deepseek-v4-pro_3
  type: pi
  enabled: false
  task_types:
  - decide
  - execute
  max_running: 1
  priority: 2
  env:
    TSEC_SERVER_HOST: 10.0.0.44:8000
