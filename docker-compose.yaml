name: rabbit-pentest

networks:
  default:
    name: rabbit-pentest-net
  worker:
    name: rabbit-pentest-worker-net
    internal: true

services:
  pentest-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: rabbit-pentest-app:latest
    container_name: rabbit-pentest-server
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./datas/cairn/:/root/.local/share/cairn/
      - ./dispatch.yaml:/cairn/dispatch.yaml:ro
      - ./.rabbit:/cairn/.rabbit
    # Same .env as dispatcher: report composer reads PI_API_KEY_* from here
    # to expand ${VAR} placeholders in dispatch.yaml at report time.
    env_file:
      - .env
    environment:
      CAIRN_DISPATCHER_INTERNAL_URL: "http://rabbit-pentest-dispatcher:8989"
      CAIRN_REPORT_COMPOSER_CONFIG_PATH: "/cairn/dispatch.yaml"
      CAIRN_PROJECT_CONTEXT_ROOT: "/cairn/.rabbit/context"
      # A freshly reset local installation has no account, so registration
      # must remain available for the owner to create the first login.
      CAIRN_ALLOW_REGISTRATION: "1"
      CAIRN_ENABLE_API_DOCS: "0"
      # Timeout (seconds) for the longer-running worker connectivity test and
      # config read/write proxy calls to the dispatcher internal API. Independent
      # of CAIRN_DISPATCHER_INTERNAL_TIMEOUT (status polling, default 2.0s).
      # Defaults to 30s in code; set here only to override.
      CAIRN_DISPATCHER_INTERNAL_TEST_TIMEOUT: "30"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    command: ["uv", "run", "cairn", "serve", "--host", "0.0.0.0", "--no-access-log"]
  pentest-dispatcher:
    image: rabbit-pentest-app:latest
    pull_policy: never
    container_name: rabbit-pentest-dispatcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dispatch.yaml:/cairn/dispatch.yaml
      - ./.rabbit:/cairn/.rabbit:ro
      - rabbit-pentest-artifacts:/audit-data
    # Secrets are loaded from .env (git-ignored) so API keys never live in
    # dispatch.yaml. dispatch.yaml references them as ${VAR_NAME}; the
    # dispatcher expands them at config load time (see config.py).
    env_file:
      - .env
    environment:
      CAIRN_DISPATCHER_INTERNAL_API: "1"
      CAIRN_DISPATCHER_INTERNAL_HOST: "0.0.0.0"
      CAIRN_DISPATCHER_INTERNAL_PORT: "8989"
      CAIRN_PROJECT_CONTEXT_ROOT: "/cairn/.rabbit/context"
      CAIRN_WORKER_EGRESS_PROXY_URL: ""
      CAIRN_WORKER_EGRESS_PROXY_TOKEN: ""
    depends_on:
      pentest-server:
        condition: service_healthy
    restart: unless-stopped
    command: ["uv", "run", "cairn", "dispatch", "--config", "dispatch.yaml"]
  pentest-egress-proxy:
    image: rabbit-pentest-app:latest
    pull_policy: never
    container_name: rabbit-pentest-egress-proxy
    networks:
      - default
      - worker
    volumes:
      - ./.rabbit/context:/scope:ro
    env_file:
      - .env
    environment:
      CAIRN_PROJECT_CONTEXT_ROOT: "/scope"
      CAIRN_EGRESS_PROVIDER_ENDPOINTS: "vip.luminai.cc:443,vsllm.com:443,xplt.sdu.edu.cn:4000,api.deepseek.com:443"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import socket; socket.create_connection(('127.0.0.1', 18888), timeout=3).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "cairn.egress_proxy", "--context-root", "/scope"]

volumes:
  rabbit-pentest-artifacts:
    name: rabbit-pentest-artifacts
