name: rabbit-pentest

networks:
  default:
    name: rabbit-pentest-net
  worker:
    name: rabbit-pentest-worker-net
    internal: true

services:
  pentest-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: rabbit-pentest-app:latest
    container_name: rabbit-pentest-server
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./datas/cairn/:/root/.local/share/cairn/
      - ./${CAIRN_DISPATCH_CONFIG:-dispatch.local.yaml}:/cairn/dispatch.yaml:ro
      - ./.rabbit:/cairn/.rabbit
    env_file:
      - .env
    environment:
      CAIRN_DISPATCHER_INTERNAL_URL: "http://rabbit-pentest-dispatcher:8989"
      CAIRN_REPORT_COMPOSER_CONFIG_PATH: "/cairn/dispatch.yaml"
      CAIRN_PROJECT_CONTEXT_ROOT: "/cairn/.rabbit/context"
      CAIRN_ALLOW_REGISTRATION: "1"
      CAIRN_ENABLE_API_DOCS: "0"
      CAIRN_DISPATCHER_INTERNAL_TEST_TIMEOUT: "30"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    command: ["uv", "run", "cairn", "serve", "--host", "0.0.0.0", "--no-access-log"]
  pentest-dispatcher:
    image: rabbit-pentest-app:latest
    pull_policy: never
    container_name: rabbit-pentest-dispatcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./${CAIRN_DISPATCH_CONFIG:-dispatch.local.yaml}:/cairn/dispatch.yaml
      - ./.rabbit:/cairn/.rabbit:ro
      - rabbit-pentest-artifacts:/audit-data
    env_file:
      - .env
    environment:
      CAIRN_DISPATCHER_INTERNAL_API: "1"
      CAIRN_DISPATCHER_INTERNAL_HOST: "0.0.0.0"
      CAIRN_DISPATCHER_INTERNAL_PORT: "8989"
      CAIRN_PROJECT_CONTEXT_ROOT: "/cairn/.rabbit/context"
      CAIRN_WORKER_EGRESS_PROXY_URL: ""
    depends_on:
      pentest-server:
        condition: service_healthy
    restart: unless-stopped
    command: ["uv", "run", "cairn", "dispatch", "--config", "dispatch.yaml"]
  pentest-egress-proxy:
    image: rabbit-pentest-app:latest
    pull_policy: never
    container_name: rabbit-pentest-egress-proxy
    networks:
      - default
      - worker
    volumes:
      - ./.rabbit/context:/scope:ro
    env_file:
      - .env
    environment:
      CAIRN_PROJECT_CONTEXT_ROOT: "/scope"
      CAIRN_EGRESS_PROVIDER_ENDPOINTS: "vip.luminai.cc:443,vsllm.com:443,internal-llm-gateway.example.com:4000,api.deepseek.com:443,open.bigmodel.cn:443"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import socket; socket.create_connection(('127.0.0.1', 18888), timeout=3).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "cairn.egress_proxy", "--context-root", "/scope"]

volumes:
  rabbit-pentest-artifacts:
    name: rabbit-pentest-artifacts
